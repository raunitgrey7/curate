name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_LINK_MODE: copy
      CURATE_SEED: "42"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install environment (Python 3.13, CPU torch wheels)
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Cache MovieLens 100k
        uses: actions/cache@v4
        with:
          path: data/ml-100k.zip
          key: ml-100k-50d2a982c66986937beb9ffb3aa76efe955bf3d5c6b761f4e3a7cd717c6a3229

      - name: Fetch and verify datasets
        run: uv run python -m curate.cli data

      - name: Tests
        run: uv run pytest -q

      - name: Benchmark
        run: uv run python -m curate.bench --seed 42

      - name: Quality gate (explicit thresholds in benchmarks/thresholds.json)
        run: uv run python -m curate.bench --check

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/results.json
            benchmarks/results.md

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-test-bench
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t curate:ci .
      - name: Smoke test container
        run: |
          docker run -d --rm -p 8000:8000 --name curate curate:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl -fsS -X POST http://127.0.0.1:8000/v1/recommend -H 'content-type: application/json' -d '{"user_id": 1, "k": 3}'
          docker stop curate
